<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광주은광교회 비전찬양대 연습실</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cathedral-dark: #121824;      /* 독일 고딕 대성당의 깊은 밤색/네이비 */
            --cathedral-card: #1b2436;      /* 카드 배경 (성스러운 다크 톤) */
            --gold-accent: #d4af37;        /* 천국의 빛, 골드 */
            --heaven-glow: rgba(212, 175, 55, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background-color: var(--cathedral-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            line-height: 1.7;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--cathedral-dark) 70%);
            background-attachment: fixed;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            margin: 30px 0 40px;
        }

        header h1 {
            font-family: 'Cinzel', serif, 'Noto Serif KR';
            color: var(--gold-accent);
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* 공지사항 & 대표기도 및 예배순서 카드 */
        .notice-card {
            background: linear-gradient(135deg, rgba(27, 36, 54, 0.95), rgba(30, 41, 59, 0.95));
            border: 1px solid var(--border-gold);
            color: var(--text-main);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 0 15px var(--heaven-glow);
        }

        .notice-card h3 {
            color: var(--gold-accent);
            margin: 0 0 12px 0;
            font-size: 1.05rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 8px;
        }

        .notice-text {
            margin: 0 0 16px 0;
            padding-left: 18px;
            font-size: 0.92rem;
            color: #e2e8f0;
        }

        .notice-text li {
            margin-bottom: 5px;
        }

        .prayer-section {
            background: rgba(18, 24, 36, 0.6);
            border: 1px dashed var(--border-gold);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 14px;
        }

        .prayer-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--gold-accent);
            margin-bottom: 6px;
        }

        .prayer-list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .prayer-list li {
            margin-bottom: 3px;
        }

        /* 섹션 타이틀 */
        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold-accent);
            margin: 35px 0 16px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        /* 날짜별 카드 스타일 */
        .schedule-card {
            background: var(--cathedral-card);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-gold);
            position: relative;
            overflow: hidden;
        }

        .schedule-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gold-accent);
        }

        .date-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-accent);
            border: 1px solid var(--border-gold);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* 곡 한 줄 레이아웃 */
        .song-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 0;
        }

        .song-info {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .song-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .song-page {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* 파트 버튼 그룹 */
        .part-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap
